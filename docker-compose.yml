services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multitenant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs "alembic upgrade head" once on startup then exits.
  # server waits for this to complete successfully before starting.
  db-migrate:
    build:
      context: src/server
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multitenant
    volumes:
      - ./src/server:/app
      - ./src/agents:/agents:ro
    working_dir: /app
    restart: "no"

  server:
    build:
      context: src/server
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multitenant
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-prod}
      ENVIRONMENT: development
      CHAT_MODEL: ${CHAT_MODEL:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      CLAUDE_SKILLS_COST_SEG_ID: ${CLAUDE_SKILLS_COST_SEG_ID:-}
      CLAUDE_SKILLS_COST_SEG_VERSION: ${CLAUDE_SKILLS_COST_SEG_VERSION:-latest}
      CLAUDE_SKILLS_MODEL: ${CLAUDE_SKILLS_MODEL:-claude-sonnet-4-6}
      CLAUDE_SKILLS_DUE_DILIGENCE_ID: ${CLAUDE_SKILLS_DUE_DILIGENCE_ID:-}
      CLAUDE_SKILLS_DUE_DILIGENCE_VERSION: ${CLAUDE_SKILLS_DUE_DILIGENCE_VERSION:-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      LOCAL_UPLOAD_DIR: /tmp/uploads
    volumes:
      - ./src/server:/app
      - ./src/agents:/agents:ro
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  agents:
    build:
      context: src/agents
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multitenant
      REDIS_URL: redis://redis:6379
      SERVER_URL: http://server:8000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-prod}
      ENVIRONMENT: development
      CHAT_MODEL: ${CHAT_MODEL:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      CLAUDE_SKILLS_COST_SEG_ID: ${CLAUDE_SKILLS_COST_SEG_ID:-}
      CLAUDE_SKILLS_COST_SEG_VERSION: ${CLAUDE_SKILLS_COST_SEG_VERSION:-latest}
      CLAUDE_SKILLS_MODEL: ${CLAUDE_SKILLS_MODEL:-claude-sonnet-4-6}
      CLAUDE_SKILLS_DUE_DILIGENCE_ID: ${CLAUDE_SKILLS_DUE_DILIGENCE_ID:-}
      CLAUDE_SKILLS_DUE_DILIGENCE_VERSION: ${CLAUDE_SKILLS_DUE_DILIGENCE_VERSION:-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      LOCAL_UPLOAD_DIR: /tmp/uploads
    volumes:
      - ./src/agents:/app
      - uploads_data:/tmp/uploads
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    ports:
      - "3000:3000"
    environment:
      AUTH_GATEWAY_PROXY_ORIGIN: http://server:8000
    volumes:
      - ./src/frontend:/app
      # Keep container npm install off the bind mount so files are not root-owned on the host.
      - /app/node_modules
      - /app/.next
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  uploads_data:
