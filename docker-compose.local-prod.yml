services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multitenant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot migration runner — uses the same server image so no extra build.
  # Runs "alembic upgrade head" and exits; server waits for it to complete
  # successfully before starting.
  db-migrate:
    build:
      context: src/server
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multitenant
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: src/server
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multitenant
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-prod}
      ENVIRONMENT: production
      CHAT_MODEL: ${CHAT_MODEL:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      CLAUDE_SKILLS_COST_SEG_ID: ${CLAUDE_SKILLS_COST_SEG_ID:-}
      CLAUDE_SKILLS_COST_SEG_VERSION: ${CLAUDE_SKILLS_COST_SEG_VERSION:-latest}
      CLAUDE_SKILLS_MODEL: ${CLAUDE_SKILLS_MODEL:-claude-sonnet-4-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCAL_UPLOAD_DIR: /tmp/uploads
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  agents:
    build:
      context: src/agents
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multitenant
      REDIS_URL: redis://redis:6379
      SERVER_URL: http://server:8000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-prod}
      ENVIRONMENT: production
      CHAT_MODEL: ${CHAT_MODEL:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      CLAUDE_SKILLS_COST_SEG_ID: ${CLAUDE_SKILLS_COST_SEG_ID:-}
      CLAUDE_SKILLS_COST_SEG_VERSION: ${CLAUDE_SKILLS_COST_SEG_VERSION:-latest}
      CLAUDE_SKILLS_MODEL: ${CLAUDE_SKILLS_MODEL:-claude-sonnet-4-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCAL_UPLOAD_DIR: /tmp/uploads
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_BACKEND_ORIGIN: http://server:8000
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
