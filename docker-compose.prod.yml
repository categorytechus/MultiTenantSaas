services:
  server:
    image: ${ECR_REGISTRY}/multitenant-saas-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      CHAT_MODEL: ${CHAT_MODEL:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      CLAUDE_SKILLS_COST_SEG_ID: ${CLAUDE_SKILLS_COST_SEG_ID:-}
      CLAUDE_SKILLS_COST_SEG_VERSION: ${CLAUDE_SKILLS_COST_SEG_VERSION:-latest}
      CLAUDE_SKILLS_MODEL: ${CLAUDE_SKILLS_MODEL:-claude-sonnet-4-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  agents:
    image: ${ECR_REGISTRY}/multitenant-saas-agents:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SERVER_URL: http://server:8000
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      CHAT_MODEL: ${CHAT_MODEL:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      CLAUDE_SKILLS_COST_SEG_ID: ${CLAUDE_SKILLS_COST_SEG_ID:-}
      CLAUDE_SKILLS_COST_SEG_VERSION: ${CLAUDE_SKILLS_COST_SEG_VERSION:-latest}
      CLAUDE_SKILLS_MODEL: ${CLAUDE_SKILLS_MODEL:-claude-sonnet-4-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_COST_SEG_PRODUCT_ID: ${STRIPE_COST_SEG_PRODUCT_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_COST_SEG_PRICE_MAPPING: ${STRIPE_COST_SEG_PRICE_MAPPING:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      server:
        condition: service_healthy

  frontend:
    image: ${ECR_REGISTRY}/multitenant-saas-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_BACKEND_ORIGIN: http://server:8000
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
